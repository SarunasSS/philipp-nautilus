apiVersion: v1
kind: ServiceAccount
metadata:
  name: philipp-alloy
  labels:
    app.kubernetes.io/name: philipp-alloy
    app.kubernetes.io/part-of: philipp-command-and-control
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: philipp-alloy-log-reader
  labels:
    app.kubernetes.io/name: philipp-alloy
    app.kubernetes.io/part-of: philipp-command-and-control
rules:
  - apiGroups:
      - ""
    resources:
      - pods
    verbs:
      - get
      - list
      - watch
  - apiGroups:
      - ""
    resources:
      - pods/log
    verbs:
      - get
  - apiGroups:
      - ""
    resources:
      - events
    verbs:
      - get
      - list
      - watch
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: philipp-alloy-log-reader
  labels:
    app.kubernetes.io/name: philipp-alloy
    app.kubernetes.io/part-of: philipp-command-and-control
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: philipp-alloy-log-reader
subjects:
  - kind: ServiceAccount
    name: philipp-alloy
