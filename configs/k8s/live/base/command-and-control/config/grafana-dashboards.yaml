apiVersion: 1

providers:
  - name: Systems
    orgId: 1
    folder: Systems
    type: file
    disableDeletion: false
    editable: false
    updateIntervalSeconds: 30
    options:
      path: /etc/grafana/dashboards/systems
  - name: Strategies
    orgId: 1
    folder: Strategies
    type: file
    disableDeletion: false
    editable: false
    updateIntervalSeconds: 30
    options:
      path: /etc/grafana/dashboards/strategies
