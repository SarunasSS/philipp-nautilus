apiVersion: 1

datasources:
  - name: Loki
    uid: loki
    type: loki
    access: proxy
    url: http://loki:3100
    isDefault: true
    editable: false
  - name: Strategy Control
    uid: strategy-control
    type: yesoreyeram-infinity-datasource
    access: proxy
    url: http://strategy-control
    isDefault: false
    editable: false
    jsonData:
      auth_method: bearerToken
      allowedHosts:
        - http://strategy-control
      timeoutInSeconds: 15
      unsecuredQueryHandling: deny
    secureJsonData:
      bearerToken: $STRATEGY_CONTROL_TOKEN
