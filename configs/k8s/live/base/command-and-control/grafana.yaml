apiVersion: v1
kind: Service
metadata:
  name: grafana
  labels:
    app.kubernetes.io/name: grafana
    app.kubernetes.io/part-of: command-and-control
spec:
  selector:
    app.kubernetes.io/name: grafana
  ports:
    - name: http
      port: 80
      targetPort: http
      protocol: TCP
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: grafana
  labels:
    app.kubernetes.io/name: grafana
    app.kubernetes.io/part-of: command-and-control
spec:
  replicas: 1
  revisionHistoryLimit: 3
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app.kubernetes.io/name: grafana
  template:
    metadata:
      labels:
        app.kubernetes.io/name: grafana
        app.kubernetes.io/part-of: command-and-control
    spec:
      automountServiceAccountToken: false
      terminationGracePeriodSeconds: 30
      securityContext:
        runAsNonRoot: true
        runAsUser: 472
        runAsGroup: 472
        fsGroup: 472
        fsGroupChangePolicy: OnRootMismatch
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: grafana
          image: grafana/grafana:13.2.0
          imagePullPolicy: IfNotPresent
          env:
            - name: GF_SECURITY_ADMIN_USER
              value: admin
            - name: GF_SECURITY_ADMIN_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: grafana-admin
                  key: admin-password
            - name: GF_SERVER_ROOT_URL
              valueFrom:
                configMapKeyRef:
                  name: command-control-config
                  key: GRAFANA_ROOT_URL
            - name: GF_USERS_ALLOW_SIGN_UP
              value: "false"
            - name: GF_AUTH_ANONYMOUS_ENABLED
              value: "false"
            - name: GF_DASHBOARDS_DEFAULT_HOME_DASHBOARD_PATH
              value: /etc/grafana/dashboards/strategies/strategy-control.json
            - name: GF_SECURITY_COOKIE_SECURE
              value: "true"
            - name: GF_PLUGINS_PREINSTALL_SYNC
              value: volkovlabs-form-panel@6.3.5,yesoreyeram-infinity-datasource@3.11.1
            - name: STRATEGY_CONTROL_TOKEN
              valueFrom:
                secretKeyRef:
                  name: grafana-strategy-control-auth
                  key: token
            - name: GF_PATHS_LOGS
              value: /tmp/grafana-logs
          ports:
            - name: http
              containerPort: 3000
              protocol: TCP
          readinessProbe:
            httpGet:
              path: /api/health
              port: http
            initialDelaySeconds: 10
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /api/health
              port: http
            initialDelaySeconds: 30
            periodSeconds: 20
          resources:
            requests:
              cpu: 100m
              memory: 256Mi
              ephemeral-storage: 128Mi
            limits:
              cpu: 500m
              memory: 512Mi
              ephemeral-storage: 512Mi
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop:
                - ALL
          volumeMounts:
            - name: data
              mountPath: /var/lib/grafana
            - name: provisioning
              mountPath: /etc/grafana/provisioning/datasources/datasource.yaml
              subPath: datasource.yaml
              readOnly: true
            - name: provisioning
              mountPath: /etc/grafana/provisioning/dashboards/dashboards.yaml
              subPath: dashboards.yaml
              readOnly: true
            - name: systems-dashboard
              mountPath: /etc/grafana/dashboards/systems
              readOnly: true
            - name: strategies-dashboard
              mountPath: /etc/grafana/dashboards/strategies
              readOnly: true
            - name: tmp
              mountPath: /tmp
        - name: user-bootstrap
          image: grafana/grafana:13.2.0
          imagePullPolicy: IfNotPresent
          command:
            - /bin/sh
            - -ec
          args:
            - |
              until curl --fail --silent http://127.0.0.1:3000/api/health >/dev/null; do
                sleep 2
              done

              lookup_status="$(curl --silent --show-error --output /tmp/philipp-user.json \
                --write-out '%{http_code}' \
                --user "$GRAFANA_ADMIN_USER:$GRAFANA_ADMIN_PASSWORD" \
                --get --data-urlencode "loginOrEmail=$GRAFANA_PHILIPP_LOGIN" \
                http://127.0.0.1:3000/api/users/lookup)"

              if [ "$lookup_status" = "404" ]; then
                create_status="$(curl --silent --show-error --output /tmp/philipp-user.json \
                  --write-out '%{http_code}' \
                  --user "$GRAFANA_ADMIN_USER:$GRAFANA_ADMIN_PASSWORD" \
                  --header 'Content-Type: application/json' \
                  --data-binary "{\"name\":\"Philipp\",\"email\":\"philipp@example.invalid\",\"login\":\"$GRAFANA_PHILIPP_LOGIN\",\"password\":\"$GRAFANA_PHILIPP_PASSWORD\",\"OrgId\":1}" \
                  http://127.0.0.1:3000/api/admin/users)"
                if [ "$create_status" != "200" ]; then
                  echo "Failed to create the managed Grafana user (HTTP $create_status)." >&2
                  sed 's/"password":"[^"]*"/"password":"[redacted]"/' /tmp/philipp-user.json >&2
                  exit 1
                fi
                echo "Created the managed Grafana Viewer account."
              elif [ "$lookup_status" = "200" ]; then
                echo "The managed Grafana account already exists."
              else
                echo "Failed to look up the managed Grafana user (HTTP $lookup_status)." >&2
                exit 1
              fi

              exec sleep 2147483647
          env:
            - name: GRAFANA_ADMIN_USER
              value: admin
            - name: GRAFANA_ADMIN_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: grafana-admin
                  key: admin-password
            - name: GRAFANA_PHILIPP_LOGIN
              value: philipp
            - name: GRAFANA_PHILIPP_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: grafana-philipp
                  key: password
          resources:
            requests:
              cpu: 5m
              memory: 16Mi
              ephemeral-storage: 8Mi
            limits:
              cpu: 50m
              memory: 64Mi
              ephemeral-storage: 32Mi
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop:
                - ALL
          volumeMounts:
            - name: tmp
              mountPath: /tmp
      volumes:
        - name: data
          emptyDir:
            sizeLimit: 512Mi
        - name: provisioning
          configMap:
            name: grafana-provisioning
        - name: systems-dashboard
          configMap:
            name: grafana-systems-dashboard
        - name: strategies-dashboard
          configMap:
            name: grafana-strategies-dashboard
        - name: tmp
          emptyDir:
            sizeLimit: 128Mi
