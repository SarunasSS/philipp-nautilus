apiVersion: v1
kind: Service
metadata:
  name: philipp-grafana
  labels:
    app.kubernetes.io/name: philipp-grafana
    app.kubernetes.io/part-of: philipp-command-and-control
spec:
  selector:
    app.kubernetes.io/name: philipp-grafana
  ports:
    - name: http
      port: 80
      targetPort: http
      protocol: TCP
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: philipp-grafana
  labels:
    app.kubernetes.io/name: philipp-grafana
    app.kubernetes.io/part-of: philipp-command-and-control
spec:
  replicas: 1
  revisionHistoryLimit: 3
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app.kubernetes.io/name: philipp-grafana
  template:
    metadata:
      labels:
        app.kubernetes.io/name: philipp-grafana
        app.kubernetes.io/part-of: philipp-command-and-control
    spec:
      automountServiceAccountToken: false
      terminationGracePeriodSeconds: 30
      securityContext:
        runAsNonRoot: true
        runAsUser: 472
        runAsGroup: 472
        fsGroup: 472
        fsGroupChangePolicy: OnRootMismatch
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: grafana
          image: grafana/grafana:review-required
          imagePullPolicy: IfNotPresent
          env:
            - name: GF_SECURITY_ADMIN_USER
              value: admin
            - name: GF_SECURITY_ADMIN_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: philipp-grafana-admin
                  key: admin-password
            - name: GF_SERVER_ROOT_URL
              valueFrom:
                configMapKeyRef:
                  name: philipp-command-control-config
                  key: GRAFANA_ROOT_URL
            - name: GF_USERS_ALLOW_SIGN_UP
              value: "false"
            - name: GF_AUTH_ANONYMOUS_ENABLED
              value: "false"
            - name: GF_SECURITY_COOKIE_SECURE
              value: "true"
            - name: GF_PATHS_LOGS
              value: /tmp/grafana-logs
          ports:
            - name: http
              containerPort: 3000
              protocol: TCP
          readinessProbe:
            httpGet:
              path: /api/health
              port: http
            initialDelaySeconds: 10
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /api/health
              port: http
            initialDelaySeconds: 30
            periodSeconds: 20
          resources:
            requests:
              cpu: 100m
              memory: 256Mi
              ephemeral-storage: 128Mi
            limits:
              cpu: 500m
              memory: 512Mi
              ephemeral-storage: 512Mi
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop:
                - ALL
          volumeMounts:
            - name: data
              mountPath: /var/lib/grafana
            - name: provisioning
              mountPath: /etc/grafana/provisioning/datasources/datasource.yaml
              subPath: datasource.yaml
              readOnly: true
            - name: provisioning
              mountPath: /etc/grafana/provisioning/dashboards/dashboards.yaml
              subPath: dashboards.yaml
              readOnly: true
            - name: dashboard
              mountPath: /etc/grafana/dashboards
              readOnly: true
            - name: tmp
              mountPath: /tmp
      volumes:
        - name: data
          emptyDir:
            sizeLimit: 512Mi
        - name: provisioning
          configMap:
            name: philipp-grafana-provisioning
        - name: dashboard
          configMap:
            name: philipp-grafana-dashboard
        - name: tmp
          emptyDir:
            sizeLimit: 128Mi
