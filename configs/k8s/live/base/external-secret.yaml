apiVersion: external-secrets.io/v1beta1
kind: ExternalSecret
metadata:
  name: philipp-trading-env
  labels:
    app.kubernetes.io/name: philipp-subscribe
    app.kubernetes.io/part-of: philipp-trading
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: gcp-gsm
    kind: ClusterSecretStore
  target:
    name: philipp-trading-env
    creationPolicy: Owner
  data:
    - secretKey: DATABENTO_API_KEY
      remoteRef:
        key: philipp-trading-dev-databento-api-key
