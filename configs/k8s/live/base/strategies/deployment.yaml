apiVersion: apps/v1
kind: Deployment
metadata:
  name: subscribe
  labels:
    app.kubernetes.io/name: subscribe
    app.kubernetes.io/part-of: trading
spec:
  replicas: 1
  revisionHistoryLimit: 3
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app.kubernetes.io/name: subscribe
  template:
    metadata:
      labels:
        app.kubernetes.io/name: subscribe
        app.kubernetes.io/part-of: trading
        trading.philipp.io/ib-client: "true"
    spec:
      automountServiceAccountToken: false
      terminationGracePeriodSeconds: 30
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
        runAsGroup: 10001
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: philipp-trading-dev
          image: philipp-trading-dev:latest
          imagePullPolicy: Always
          command:
            - python
            - main.py
          args:
            - live
            - subscribe
            - run
          envFrom:
            - configMapRef:
                name: subscribe-config
          env:
            - name: TRADOVATE_ENVIRONMENT
              value: demo
            - name: DATABENTO_API_KEY
              valueFrom:
                secretKeyRef:
                  name: trading-env
                  key: DATABENTO_API_KEY
          resources:
            requests:
              cpu: 250m
              memory: 512Mi
            limits:
              cpu: "1"
              memory: 2Gi
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop:
                - ALL
