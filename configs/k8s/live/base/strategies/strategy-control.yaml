apiVersion: v1
kind: ServiceAccount
metadata:
  name: strategy-control
  labels:
    app.kubernetes.io/name: strategy-control
    app.kubernetes.io/part-of: trading
automountServiceAccountToken: true
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: strategy-control
  labels:
    app.kubernetes.io/name: strategy-control
    app.kubernetes.io/part-of: trading
rules:
  - apiGroups:
      - ""
    resources:
      - configmaps
    resourceNames:
      - subscribe-config
      - htf-sweep-cisd-config
    verbs:
      - get
      - update
  - apiGroups:
      - apps
    resources:
      - deployments
    resourceNames:
      - subscribe
      - htf-sweep-cisd
    verbs:
      - get
      - patch
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: strategy-control
  labels:
    app.kubernetes.io/name: strategy-control
    app.kubernetes.io/part-of: trading
subjects:
  - kind: ServiceAccount
    name: strategy-control
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: strategy-control
---
apiVersion: v1
kind: Service
metadata:
  name: strategy-control
  labels:
    app.kubernetes.io/name: strategy-control
    app.kubernetes.io/part-of: trading
spec:
  selector:
    app.kubernetes.io/name: strategy-control
  ports:
    - name: http
      port: 80
      targetPort: http
      protocol: TCP
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: strategy-control
  labels:
    app.kubernetes.io/name: strategy-control
    app.kubernetes.io/part-of: trading
spec:
  replicas: 1
  revisionHistoryLimit: 3
  selector:
    matchLabels:
      app.kubernetes.io/name: strategy-control
  template:
    metadata:
      labels:
        app.kubernetes.io/name: strategy-control
        app.kubernetes.io/part-of: trading
    spec:
      serviceAccountName: strategy-control
      automountServiceAccountToken: true
      terminationGracePeriodSeconds: 15
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
        runAsGroup: 10001
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: control-api
          image: nautilus:review-required
          imagePullPolicy: IfNotPresent
          command:
            - python
            - -m
            - uvicorn
          args:
            - phillip.control.api:app
            - --host
            - 0.0.0.0
            - --port
            - "8080"
            - --no-access-log
          env:
            - name: STRATEGY_NAMESPACE
              valueFrom:
                fieldRef:
                  fieldPath: metadata.namespace
            - name: STRATEGY_REGISTRY_PATH
              value: /etc/strategy-control/strategies.json
            - name: CONTROL_API_TOKEN
              valueFrom:
                secretKeyRef:
                  name: strategy-control-auth
                  key: token
          ports:
            - name: http
              containerPort: 8080
              protocol: TCP
          readinessProbe:
            httpGet:
              path: /healthz
              port: http
            initialDelaySeconds: 5
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /healthz
              port: http
            initialDelaySeconds: 15
            periodSeconds: 20
          resources:
            requests:
              cpu: 50m
              memory: 128Mi
              ephemeral-storage: 64Mi
            limits:
              cpu: 500m
              memory: 512Mi
              ephemeral-storage: 256Mi
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop:
                - ALL
          volumeMounts:
            - name: strategy-registry
              mountPath: /etc/strategy-control
              readOnly: true
            - name: tmp
              mountPath: /tmp
      volumes:
        - name: strategy-registry
          configMap:
            name: strategy-registry
        - name: tmp
          emptyDir:
            sizeLimit: 64Mi
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: strategy-control
  labels:
    app.kubernetes.io/name: strategy-control
    app.kubernetes.io/part-of: trading
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/name: strategy-control
  policyTypes:
    - Ingress
  ingress:
    - from:
        - podSelector:
            matchLabels:
              app.kubernetes.io/name: grafana
      ports:
        - port: 8080
          protocol: TCP
