[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "philipp-nautilus"
version = "0.1.0"
description = "Minimal Nautilus Trader backtest scaffold."
readme = "README.md"
requires-python = ">=3.13,<3.14"
dependencies = [
    "databento>=0.57,<1",
    "nautilus_trader>=1.228,<1.229",
    "python-dotenv>=1.2,<2",
    "typer>=0.20,<0.21",
]

[tool.setuptools]
py-modules = ["main"]
packages = ["cli", "strategies"]
